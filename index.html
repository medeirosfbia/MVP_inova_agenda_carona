<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carona Bairro - MVP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #4CAF50;
            --primary-dark: #388E3C;
            --secondary-color: #2196F3;
            --background-color: #f5f5f5;
            --card-background: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 24px 16px;
            text-align: center;
            border-radius: 0 0 16px 16px;
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        header p {
            font-size: 16px;
            opacity: 0.95;
            font-weight: 400;
        }

        /* Main Content */
        main {
            padding: 24px 0;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        /* Cards */
        .rides-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .ride-card {
            background: var(--card-background);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .ride-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .ride-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .ride-time {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .ride-price {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .ride-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-icon {
            width: 20px;
            height: 20px;
            color: var(--secondary-color);
        }

        .info-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .info-value {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .seats-available {
            background: #e8f5e9;
            color: var(--primary-dark);
            padding: 8px 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .seats-available.low {
            background: #fff3e0;
            color: #f57c00;
        }

        .seats-available.full {
            background: #ffebee;
            color: #d32f2f;
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark), #2E7D32);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
            transform: none;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--card-background);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        .form-input::placeholder {
            color: #9e9e9e;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: var(--text-primary);
            flex: 1;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 24px 16px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 360px) {
            header h1 {
                font-size: 24px;
            }

            .ride-time {
                font-size: 28px;
            }

            .ride-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🚗 Carona Bairro</h1>
            <p>Caronas do Ponto ao Centro</p>
        </div>
    </header>

    <main class="container">
        <h2 class="section-title">Horários Disponíveis Hoje</h2>
        <div class="rides-list" id="ridesList">
            <!-- Cards serão inseridos via JavaScript -->
        </div>
    </main>

    <footer>
        <p>© 2024 Carona Bairro - Comunidade Conectada</p>
    </footer>

    <!-- Modal de Reserva -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Reservar Vaga</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <form id="reservationForm">
                <input type="hidden" id="selectedRideId">
                <input type="hidden" id="selectedRideTime">
                <input type="hidden" id="selectedDriverPhone">
                
                <div class="form-group">
                    <label class="form-label" for="passengerName">Seu Nome</label>
                    <input 
                        type="text" 
                        id="passengerName" 
                        class="form-input" 
                        placeholder="Digite seu nome completo"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="passengerWhatsApp">Seu WhatsApp</label>
                    <input 
                        type="tel" 
                        id="passengerWhatsApp" 
                        class="form-input" 
                        placeholder="(00) 00000-0000"
                        required
                    >
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Confirmar Reserva</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURAÇÕES FÁCEIS DE ALTERAR
        // ============================================
        
        // Número do WhatsApp do motorista (formato internacional sem +)
        const DRIVER_WHATSAPP = "5511999999999";
        
        // Lista de horários disponíveis
        const RIDES = [
            {
                id: 1,
                time: "06:30",
                driver: "João Silva",
                car: "Honda Civic - Prata",
                price: "R$ 5,00",
                totalSeats: 4,
                availableSeats: 2
            },
            {
                id: 2,
                time: "07:15",
                driver: "Maria Santos",
                car: "Toyota Corolla - Branco",
                price: "R$ 5,00",
                totalSeats: 4,
                availableSeats: 3
            },
            {
                id: 3,
                time: "08:00",
                driver: "Pedro Oliveira",
                car: "Volkswagen Gol - Azul",
                price: "R$ 5,00",
                totalSeats: 4,
                availableSeats: 1
            }
        ];

        // ============================================
        // LÓGICA DO APLICATIVO
        // ============================================

        // Renderizar cards de carona
        function renderRides() {
            const ridesList = document.getElementById('ridesList');
            ridesList.innerHTML = '';

            RIDES.forEach(ride => {
                const seatsClass = ride.availableSeats === 0 ? 'full' : 
                                  ride.availableSeats <= 1 ? 'low' : '';
                
                const seatsText = ride.availableSeats === 0 ? 'Lotação Completa' :
                                 `${ride.availableSeats} de ${ride.totalSeats} vagas`;

                const isDisabled = ride.availableSeats === 0;

                const card = document.createElement('div');
                card.className = 'ride-card';
                card.innerHTML = `
                    <div class="ride-header">
                        <div class="ride-time">${ride.time}</div>
                        <div class="ride-price">${ride.price}</div>
                    </div>
                    
                    <div class="ride-info">
                        <div class="info-item">
                            <svg class="info-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                            <div>
                                <div class="info-label">Motorista</div>
                                <div class="info-value">${ride.driver}</div>
                            </div>
                        </div>
                        
                        <div class="info-item">
                            <svg class="info-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"></path>
                            </svg>
                            <div>
                                <div class="info-label">Veículo</div>
                                <div class="info-value">${ride.car}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="seats-available ${seatsClass}">
                        ${seatsText}
                    </div>
                    
                    <button 
                        class="btn btn-primary" 
                        onclick="openModal(${ride.id})"
                        ${isDisabled ? 'disabled' : ''}
                    >
                        ${isDisabled ? 'Sem Vagas' : 'Reservar Vaga'}
                    </button>
                `;

                ridesList.appendChild(card);
            });
        }

        // Abrir modal
        function openModal(rideId) {
            const ride = RIDES.find(r => r.id === rideId);
            if (!ride) return;

            document.getElementById('selectedRideId').value = ride.id;
            document.getElementById('selectedRideTime').value = ride.time;
            document.getElementById('selectedDriverPhone').value = DRIVER_WHATSAPP;
            
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('passengerName').focus();
        }

        // Fechar modal
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.getElementById('reservationForm').reset();
        }

        // Formatr WhatsApp para link
        function formatWhatsAppNumber(number) {
            return number.replace(/\D/g, '');
        }

        // Enviar reserva para WhatsApp
        function sendToWhatsApp(name, whatsapp, time, driverPhone) {
            const message = `Olá! Sou ${name}, quero reservar 1 vaga para a carona das ${time} de hoje. Como faço o Pix?`;
            const encodedMessage = encodeURIComponent(message);
            const formattedPhone = formatWhatsAppNumber(driverPhone);
            
            const whatsappUrl = `https://wa.me/${formattedPhone}?text=${encodedMessage}`;
            
            // Redirecionar para WhatsApp
            window.open(whatsappUrl, '_blank');
            
            // Fechar modal após redirecionamento
            setTimeout(() => {
                closeModal();
            }, 500);
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            renderRides();

            // Fechar modal
            document.getElementById('modalClose').addEventListener('click', closeModal);
            document.getElementById('cancelBtn').addEventListener('click', closeModal);
            document.getElementById('modalOverlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('modalOverlay')) {
                    closeModal();
                }
            });

            // Submit do formulário
            document.getElementById('reservationForm').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const name = document.getElementById('passengerName').value.trim();
                const whatsapp = document.getElementById('passengerWhatsApp').value.trim();
                const time = document.getElementById('selectedRideTime').value;
                const driverPhone = document.getElementById('selectedDriverPhone').value;

                if (name && whatsapp) {
                    sendToWhatsApp(name, whatsapp, time, driverPhone);
                }
            });

            // Máscara para WhatsApp
            document.getElementById('passengerWhatsApp').addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length > 11) value = value.slice(0, 11);
                
                if (value.length >= 10) {
                    value = `(${value.slice(0, 2)}) ${value.slice(2, 7)}-${value.slice(7)}`;
                } else if (value.length >= 6) {
                    value = `(${value.slice(0, 2)}) ${value.slice(2)}-${value.slice(6)}`;
                } else if (value.length >= 2) {
                    value = `(${value.slice(0, 2)})${value.slice(2)}`;
                }
                
                e.target.value = value;
            });
        });

        // Expor função openModal globalmente
        window.openModal = openModal;
    </script>
</body>
</html>
