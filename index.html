<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carona Bairro - MVP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🚗 Carona Bairro</h1>
            <p>Caronas do Ponto ao Centro</p>
        </div>
    </header>

    <main class="container">
        <h2 class="section-title">Horários Disponíveis Hoje</h2>
        <div class="rides-list" id="ridesList">
            <!-- Cards serão inseridos via JavaScript -->
        </div>
    </main>

    <footer>
        <p>© 2024 Carona Bairro - Comunidade Conectada</p>
    </footer>

    <!-- Modal de Reserva -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Reservar Vaga</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <form id="reservationForm">
                <input type="hidden" id="selectedRideId">
                <input type="hidden" id="selectedRideTime">
                <input type="hidden" id="selectedDriverPhone">
                
                <div class="form-group">
                    <label class="form-label" for="passengerName">Seu Nome</label>
                    <input 
                        type="text" 
                        id="passengerName" 
                        class="form-input" 
                        placeholder="Digite seu nome completo"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="passengerWhatsApp">Seu WhatsApp</label>
                    <input 
                        type="tel" 
                        id="passengerWhatsApp" 
                        class="form-input" 
                        placeholder="(00) 00000-0000"
                        required
                    >
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Confirmar Reserva</button>
                </div>
            </form>
        </div>
    </div>

    <script src="javascript.js"></script>
</body>
</html>
